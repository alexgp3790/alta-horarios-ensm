<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alta de Horarios Docentes - ENSM</title>
  <style>
    :root {
      --primary: #1a365d;
      --accent: #2b6cb0;
      --success: #2f855a;
      --danger: #c53030;
      --bg: #f7fafc;
      --card: #ffffff;
      --text: #2d3748;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border-top: 5px solid var(--primary);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 15px;
    }

    .header h1 {
      font-size: 1.4rem;
      color: var(--primary);
      margin: 0 0 5px 0;
    }

    .header h2 {
      font-size: 1.05rem;
      color: #4a5568;
      margin: 0;
      font-weight: 500;
    }

    .auth-box {
      background: #edf2f7;
      padding: 20px;
      border-radius: 6px;
      margin-bottom: 25px;
      border: 1px solid #cbd5e0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
    }

    .btn {
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary { background-color: var(--primary); color: white; }
    .btn-primary:hover { background-color: var(--accent); }

    .btn-add { background-color: var(--accent); color: white; width: 100%; margin-top: 5px; }
    .btn-add:hover { background-color: #2c5282; }

    .btn-submit { background-color: var(--success); color: white; width: 100%; font-size: 1.05rem; padding: 12px; margin-top: 15px; }
    .btn-submit:hover { background-color: #276749; }

    .btn-danger { background-color: var(--danger); color: white; padding: 4px 8px; font-size: 0.8rem; }

    .table-custom {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
    }

    .table-custom th, .table-custom td {
      border: 1px solid #cbd5e0;
      padding: 8px 10px;
      text-align: left;
      font-size: 0.88rem;
    }

    .table-custom th {
      background-color: #edf2f7;
    }

    #app-form, #receipt-modal, #group-container {
      display: none;
    }

    @media print {
      body * { visibility: hidden; }
      #receipt-modal, #receipt-modal * { visibility: visible; }
      #receipt-modal {
        position: absolute; left: 0; top: 0; width: 100%; display: block !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="container" id="main-container">
    <div class="header">
      <h1>ESCUELA NORMAL SUPERIOR DE MÉXICO</h1>
      <h2>División de Licenciaturas | Captura de Carga Horaria Docente</h2>
    </div>

    <!-- MÓDULO DE AUTENTICACIÓN / ACCESO -->
    <div class="auth-box" id="auth-section">
      <div class="form-group">
        <label for="role-select">Tipo de Usuario:</label>
        <select id="role-select" onchange="cambiarRol()">
          <option value="docente">Docente</option>
          <option value="coordinador">Coordinador de Licenciatura</option>
        </select>
      </div>

      <div class="form-group">
        <label for="teacher-select">Seleccione Docente:</label>
        <select id="teacher-select">
          <option value="">-- Cargando lista... --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="pass-input" id="pass-label">PIN Único de Docente (4 dígitos):</label>
        <input type="password" id="pass-input" placeholder="Ej. 0203 o 203">
      </div>

      <button type="button" class="btn btn-primary" onclick="validarAcceso()" style="width: 100%;">Validar Acceso</button>
      <p id="auth-error" style="color: var(--danger); font-size: 0.85rem; display: none; margin-top: 10px; text-align: center;"></p>
    </div>

    <!-- FORMULARIO DE CAPTURA DE MATERIAS -->
    <div id="app-form">
      <div style="background-color: #ebf8ff; border-left: 4px solid var(--accent); padding: 12px; margin-bottom: 20px; border-radius: 4px;">
        <strong id="active-user-name"></strong><br>
        <span style="font-size: 0.85rem; color: #4a5568;">Docente autenticado correctamente. Puede registrar múltiples materias para su acuse.</span>
      </div>

      <fieldset style="border: 1px solid #cbd5e0; border-radius: 6px; padding: 15px; margin-bottom: 20px;">
        <legend style="font-weight: bold; color: var(--primary); padding: 0 6px;">Agregar Asignatura</legend>

        <div class="form-group">
          <label for="licenciatura">Licenciatura:</label>
          <select id="licenciatura" onchange="evaluarLicenciatura()">
            <option value="">-- Seleccione Licenciatura --</option>
            <option value="BL">BIOLOGÍA (BL)</option>
            <option value="ES">ESPAÑOL (ES)</option>
            <option value="FS">FÍSICA (FS)</option>
            <option value="FE">FORMACIÓN ÉTICA Y CIUDADANA (FE)</option>
            <option value="GE">GEOGRAFÍA (GE)</option>
            <option value="HS">HISTORIA (HS)</option>
            <option value="IN">INGLÉS (IN)</option>
            <option value="MT">MATEMÁTICAS (MT)</option>
            <option value="PE">PEDAGOGÍA (PE)</option>
            <option value="PS">PSICOLOGÍA EDUCATIVA (PS)</option>
            <option value="QM">QUÍMICA (QM)</option>
            <option value="DPX">DOCENCIA EN POSGRADO (DPX)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="semestre">Semestre:</label>
          <select id="semestre" onchange="cargarMaterias()">
            <option value="">-- Seleccione Semestre --</option>
            <option value="1">1° Semestre</option>
            <option value="2">2° Semestre</option>
            <option value="3">3° Semestre</option>
            <option value="4">4° Semestre</option>
            <option value="5">5° Semestre</option>
            <option value="6">6° Semestre</option>
            <option value="7">7° Semestre</option>
            <option value="8">8° Semestre</option>
          </select>
        </div>

        <div class="form-group">
          <label for="subject">Asignatura:</label>
          <select id="subject" disabled>
            <option value="">-- Primero seleccione Licenciatura y Semestre --</option>
          </select>
        </div>

        <div class="form-group" id="group-container">
          <label for="group">Grupo:</label>
          <select id="group">
            <option value="">-- Seleccione Grupo --</option>
            <option value="A">Grupo A</option>
            <option value="B">Grupo B</option>
          </select>
        </div>

        <div class="form-group">
          <label for="day">Día de la semana:</label>
          <select id="day">
            <option value="">-- Seleccione un día --</option>
            <option value="Lunes">Lunes</option>
            <option value="Martes">Martes</option>
            <option value="Miércoles">Miércoles</option>
            <option value="Jueves">Jueves</option>
            <option value="Viernes">Viernes</option>
          </select>
        </div>

        <div class="form-group">
          <label for="time-slot">Bloque Horario:</label>
          <select id="time-slot">
            <option value="">-- Seleccione el bloque --</option>
            <option value="07:00 - 09:00">07:00 - 09:00 hrs</option>
            <option value="09:00 - 11:00">09:00 - 11:00 hrs</option>
            <option value="11:00 - 13:00">11:00 - 13:00 hrs</option>
            <option value="13:00 - 15:00">13:00 - 15:00 hrs</option>
            <option value="15:00 - 17:00">15:00 - 17:00 hrs</option>
            <option value="17:00 - 19:00">17:00 - 19:00 hrs</option>
            <option value="19:00 - 21:00">19:00 - 21:00 hrs</option>
          </select>
        </div>

        <button type="button" class="btn btn-add" onclick="agregarMateria()">+ Agregar materia a la propuesta</button>
      </fieldset>

      <!-- TABLA PREVIA DE RESUMEN DE MATERIAS CAPTURADAS -->
      <h3 style="font-size: 1.05rem; color: var(--primary); margin-top: 20px;">Propuesta de Horarios a Registrar</h3>
      <table class="table-custom" id="preview-table">
        <thead>
